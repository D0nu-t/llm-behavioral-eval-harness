[project]
name = "llm-behavioral-eval-harness"
version = "0.1.0"
description = "Modular behavioral evaluation framework for LLM safety research"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.30.0",
    "langchain>=0.2.0",
    "transformers>=4.41.0",
    "torch>=2.3.0",
    "mlflow>=2.13.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
